name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dev deps
        run: uv pip install -e '.[dev]'
      - name: ruff check
        run: ruff check quackmem/ tests/

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dev deps
        run: uv pip install --system -e '.[dev,langgraph,openai-agents]'
      - name: mypy
        run: mypy quackmem/

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quackmem
          POSTGRES_PASSWORD: quackmem
          POSTGRES_DB: quackmem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quackmem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      QUACKMEM_TEST_DB_URL: postgresql+asyncpg://quackmem:quackmem@localhost:5432/quackmem_test

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dev deps
        run: uv pip install --system --python ${{ matrix.python-version }} -e '.[dev,langgraph,openai-agents]'
      - name: Run tests
        run: pytest -v --tb=short
