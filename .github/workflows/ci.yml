name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"        # ← invalidate on lockfile change
      - name: Install dev deps
        run: uv sync --frozen --python 3.12 --extra dev   # ← lockfile, pinned Python
      - name: ruff check
        run: uv run ruff check .           # ← runs in managed venv

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dev deps
        run: uv sync --frozen --python 3.12 --extra dev --extra langgraph --extra openai-agents
      - name: mypy
        run: uv run mypy quackmem/

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quackmem
          POSTGRES_PASSWORD: quackmem
          POSTGRES_DB: quackmem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quackmem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      QUACKMEM_TEST_DB_URL: postgresql+asyncpg://quackmem:quackmem@localhost:5432/quackmem_test

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install deps                        # ← one step, no separate python install
        run: uv sync --frozen --python ${{ matrix.python-version }} --extra dev --extra langgraph --extra openai-agents
      - name: Run tests
        run: uv run pytest -v --tb=short