repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(quackmem|tests)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^quackmem/
        # Mirror the deps installed by the CI mypy job so pre-commit and CI
        # can't disagree about what types are visible.
        additional_dependencies:
          - sqlalchemy>=2.0
          - pydantic>=2.0
          - pydantic-settings>=2.0
          - tenacity>=8.2
          - alembic>=1.13
          - langgraph>=0.2
          - langchain-core>=0.2
          - openai-agents>=0.0.3

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
