[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convo-tracker"
version = "0.1.0"
description = "Persist AI agent conversations to Postgres. One decorator, zero opinions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.0",
    "celery[redis]>=5.3",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-core>=0.2"]
openai-agents = ["openai-agents>=0.0.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-postgresql>=6.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
